name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set version
        run: echo "VERSION=v2.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Login GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build
        run: docker build -t ghcr.io/agroplataforma-maiz/agro-backend:${VERSION} .

      - name: Push
        run: docker push ghcr.io/agroplataforma-maiz/agro-backend:${VERSION}